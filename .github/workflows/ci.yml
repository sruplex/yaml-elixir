
name: Elixir CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  OTP_VERSION: '28'
  ELIXIR_VERSION: '1.19.1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Download the yaml-test-suite
        run: git clone --depth 1 --branch data-2022-01-17 https://github.com/yaml/yaml-test-suite tmp/yaml-test-suite

      - name: Run tests
        run: mix test

      - name: Restore Dialyzer PLT
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-otp-${{ env.OTP_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: plt-${{ runner.os }}-otp-${{ env.OTP_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-

      - name: Check code quality
        run: mix quality
