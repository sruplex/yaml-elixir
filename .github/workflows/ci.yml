
name: Elixir CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.1'
          otp-version: '28'

      - name: Install dependencies
        run: mix deps.get

      - name: Check code formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Download the yaml-test-suite
        run: git clone --depth 1 --branch data-2022-01-17 https://github.com/yaml/yaml-test-suite tmp/yaml-test-suite

      - name: Run tests
        run: mix test

      - name: Check code with Credo
        run: mix credo --strict

      - name: Restore Dialyzer PLT
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-otp-28-elixir-1.19.1-${{ hashFiles('mix.lock') }}
          restore-keys: plt-${{ runner.os }}-otp-28-elixir-1.19.1-

      # In the test environment, the native library built for the tests is reused
      - name: Run Dialyzer
        run: MIX_ENV=test mix dialyzer --format github
